version: '3.8'

services:
  dashboard:
    build: ./app
    container_name: jeece_dashboard
    ports:
      # Dashboard : http://<ip>:3000   Admin : http://<ip>:3000/admin
      - "3000:3000"
    volumes:
      # Tout le dépôt est monté : le code (app/) et les données (data/).
      - .:/srv
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
